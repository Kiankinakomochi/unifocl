name: CI And Release

# Credential policy for this workflow:
#   * No Personal Access Tokens. Version bumps push with GITHUB_TOKEN; the
#     Homebrew tap push uses a short-lived GitHub App installation token.
#   * npm publishes via OIDC trusted publishing (no NPM_TOKEN).
#   * Every action is pinned to a full commit SHA — a moved tag cannot swap
#     code in underneath us (cf. the tj-actions/changed-files compromise).
#   * `persist-credentials: false` everywhere except the one job that pushes,
#     so a compromised step cannot lift a token out of .git/config.
#
# See .github/RELEASING.md for the one-time GitHub App setup and for the
# manual WinGet submission step.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to republish (e.g. 2.3.1) — skips binary build and GitHub Release creation'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-release-${{ github.ref }}
  # Superseding a PR build is fine. Cancelling a release mid-publish is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: |
          dotnet restore src/unifocl/unifocl.csproj --locked-mode --disable-build-servers -v minimal
          dotnet build src/unifocl/unifocl.csproj --no-restore --disable-build-servers -v minimal

  # Was changelog-aggregate.yml. That workflow needed a PAT purely so its push
  # would trigger this one — a GITHUB_TOKEN push does not start a new run.
  # Folding it in as a job removes the reason for the PAT entirely: the push
  # needs no downstream trigger because `release` below just checks out the
  # commit we produced here, in this same run.
  aggregate:
    name: Aggregate Changelog & Bump Version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for fragments
        id: fragments
        shell: bash
        run: |
          set -euo pipefail
          count="$(find changelog.d -maxdepth 1 -name '*.md' ! -name '.gitkeep' 2>/dev/null | wc -l | tr -d ' ')"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Fragment count: $count"

      - name: Aggregate fragments and bump version
        if: steps.fragments.outputs.count != '0'
        run: bash scripts/aggregate-changelog.sh --commit

      - name: Push version bump
        id: push
        if: steps.fragments.outputs.count != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Pushed version bump — releasing it in this same run."

  release:
    name: Release (Main)
    needs: aggregate
    # `aggregate` is skipped on workflow_dispatch, which would otherwise skip
    # this job too.
    if: >-
      !cancelled()
      && (needs.aggregate.result == 'success' || needs.aggregate.result == 'skipped')
      && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    outputs:
      skip: ${{ steps.version.outputs.skip }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ needs.aggregate.outputs.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version bump `aggregate` just pushed, when there was one.
          ref: ${{ needs.aggregate.outputs.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Resolve release version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            semver="$INPUT_VERSION"
            tag="v${semver}"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=none" >> "$GITHUB_OUTPUT"
            echo "version=$semver" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version_file="src/unifocl/Services/CliVersion.cs"
          major="$(sed -n 's/.*Major = \([0-9]\+\);/\1/p' "$version_file" | head -n1)"
          minor="$(sed -n 's/.*Minor = \([0-9]\+\);/\1/p' "$version_file" | head -n1)"
          patch="$(sed -n 's/.*Patch = \([0-9]\+\);/\1/p' "$version_file" | head -n1)"
          devcycle="$(sed -n 's/.*DevCycle = \"\(.*\)\";/\1/p' "$version_file" | head -n1)"

          if [[ -z "$major" || -z "$minor" || -z "$patch" ]]; then
            echo "failed to resolve version from $version_file"
            exit 1
          fi

          semver="${major}.${minor}.${patch}${devcycle}"
          tag="v${semver}"

          if [[ -n "$devcycle" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=devcycle-present" >> "$GITHUB_OUTPUT"
            echo "version=$semver" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=tag-exists" >> "$GITHUB_OUTPUT"
            echo "version=$semver" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "skip_reason=none" >> "$GITHUB_OUTPUT"
          echo "version=$semver" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Restore (locked)
        if: steps.version.outputs.skip == 'false' && github.event_name != 'workflow_dispatch'
        run: |
          dotnet restore src/unifocl/unifocl.csproj --locked-mode --disable-build-servers -v minimal

      - name: Skip release notice
        if: steps.version.outputs.skip == 'true'
        shell: bash
        env:
          SKIP_REASON: ${{ steps.version.outputs.skip_reason }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          echo "release skipped: ${SKIP_REASON}"
          echo "version: ${VERSION}"
          echo "tag: ${TAG}"

      - name: Publish binaries
        if: steps.version.outputs.skip == 'false' && github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          dist=".artifacts/v${version}/dist"
          mkdir -p "$dist" ".artifacts/v${version}/macos-arm64" ".artifacts/v${version}/win-x64"

          dotnet publish src/unifocl/unifocl.csproj \
            -c Release \
            -r osx-arm64 \
            --no-restore \
            --self-contained true \
            /p:PublishSingleFile=true \
            /p:PublishTrimmed=false \
            --disable-build-servers -v minimal \
            -o ".artifacts/v${version}/macos-arm64"

          dotnet publish src/unifocl/unifocl.csproj \
            -c Release \
            -r win-x64 \
            --no-restore \
            --self-contained true \
            /p:PublishSingleFile=true \
            /p:PublishTrimmed=false \
            --disable-build-servers -v minimal \
            -o ".artifacts/v${version}/win-x64"

          tar -C ".artifacts/v${version}/macos-arm64" -czf "$dist/unifocl-${version}-macos-arm64.tar.gz" .
          (cd ".artifacts/v${version}/win-x64" && zip -qr "../../v${version}/dist/unifocl-${version}-win-x64.zip" .)
          git archive --format=tar.gz --output "$dist/unifocl-${version}.tar.gz" HEAD

          (
            cd "$dist"
            sha256sum "unifocl-${version}-macos-arm64.tar.gz" \
                      "unifocl-${version}-win-x64.zip" \
                      "unifocl-${version}.tar.gz" \
              > "unifocl-${version}-checksums.txt"
          )

      - name: Attest release artifacts
        if: steps.version.outputs.skip == 'false' && github.event_name != 'workflow_dispatch'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            .artifacts/v${{ steps.version.outputs.version }}/dist/unifocl-${{ steps.version.outputs.version }}-macos-arm64.tar.gz
            .artifacts/v${{ steps.version.outputs.version }}/dist/unifocl-${{ steps.version.outputs.version }}-win-x64.zip
            .artifacts/v${{ steps.version.outputs.version }}/dist/unifocl-${{ steps.version.outputs.version }}.tar.gz
            .artifacts/v${{ steps.version.outputs.version }}/dist/unifocl-${{ steps.version.outputs.version }}-checksums.txt

      - name: Build release notes
        if: steps.version.outputs.skip == 'false' && github.event_name != 'workflow_dispatch'
        id: notes
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          notes_file=".artifacts/v${version}/release-notes.md"
          mkdir -p ".artifacts/v${version}"

          if [[ -f CHANGELOG.md ]]; then
            awk -v v="$version" '
              BEGIN { capture=0 }
              $0 ~ "^## " v "([[:space:]]|$)" { capture=1; print; next }
              $0 ~ "^## " && capture==1 { exit }
              capture==1 { print }
            ' CHANGELOG.md > "$notes_file"
          fi

          if [[ ! -s "$notes_file" ]]; then
            {
              echo "## ${version}"
              echo
              echo "Automated release from \`main\`."
            } > "$notes_file"
          fi

          echo "file=$notes_file" >> "$GITHUB_OUTPUT"

      # Uses the built-in gh CLI rather than a third-party release action, so
      # no external code sees this job's contents:write / id-token:write scopes.
      - name: Create GitHub Release
        if: steps.version.outputs.skip == 'false' && github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
          TARGET: ${{ needs.aggregate.outputs.sha || github.sha }}
        run: |
          set -euo pipefail
          dist=".artifacts/v${VERSION}/dist"
          gh release create "$TAG" \
            --title "$TAG" \
            --target "$TARGET" \
            --notes-file "$NOTES_FILE" \
            "${dist}/unifocl-${VERSION}-macos-arm64.tar.gz" \
            "${dist}/unifocl-${VERSION}-win-x64.zip" \
            "${dist}/unifocl-${VERSION}.tar.gz" \
            "${dist}/unifocl-${VERSION}-checksums.txt" \
            scripts/install.sh \
            scripts/install.ps1

  # Gated on the "publish" environment protection rule: GitHub pauses here and
  # waits for a required reviewer. Registry credentials live as *environment*
  # secrets on that environment, so no other job in this repo can read them.
  #
  #   * Homebrew — short-lived GitHub App installation token, minted per run,
  #     scoped to the tap repo with contents:write and nothing else.
  #   * npm — OIDC trusted publishing, no stored token at all.
  publish:
    name: Publish to Registries
    needs: [aggregate, release]
    if: >-
      !cancelled()
      && needs.release.result == 'success'
      && needs.release.outputs.skip == 'false'
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Mint Homebrew tap token
        id: tap_token
        if: vars.TAP_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-unifocl
          permission-contents: write

      - name: Update Homebrew Formula Tap
        if: vars.TAP_APP_CLIENT_ID != ''
        shell: bash
        env:
          # Expires when this job ends; scoped to homebrew-unifocl only.
          TAP_TOKEN: ${{ steps.tap_token.outputs.token }}
          REPO_OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.release.outputs.version }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail

          version="$VERSION"
          tag="$TAG"
          release_asset_url="https://github.com/${REPO_OWNER}/unifocl/releases/download/${tag}/unifocl-${version}-macos-arm64.tar.gz"
          archive_path="/tmp/unifocl-${version}-macos-arm64.tar.gz"
          formula_repo_dir="$(mktemp -d)"
          formula_path="${formula_repo_dir}/Formula/unifocl.rb"

          curl -fsSL "${release_asset_url}" -o "${archive_path}"
          asset_sha256="$(sha256sum "${archive_path}" | awk '{print $1}')"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${REPO_OWNER}/homebrew-unifocl.git" "${formula_repo_dir}"

          if [[ ! -f "${formula_path}" ]]; then
            echo "Formula file not found at ${formula_path}"
            exit 1
          fi

          sed -i -E "s|^  url \".*\"$|  url \"${release_asset_url}\"|" "${formula_path}"
          sed -i -E "s|^  sha256 \".*\"$|  sha256 \"${asset_sha256}\"|" "${formula_path}"
          if grep -Eq "^  version \".*\"$" "${formula_path}"; then
            sed -i -E "s|^  version \".*\"$|  version \"${version}\"|" "${formula_path}"
          else
            awk -v v="${version}" '
              BEGIN { inserted=0 }
              {
                print
                if (!inserted && $0 ~ /^  homepage "/) {
                  print "  version \"" v "\""
                  inserted=1
                }
              }
            ' "${formula_path}" > "${formula_path}.tmp"
            mv "${formula_path}.tmp" "${formula_path}"
          fi

          if git -C "${formula_repo_dir}" diff --quiet -- Formula/unifocl.rb; then
            echo "No formula changes detected; skipping commit."
            exit 0
          fi

          git -C "${formula_repo_dir}" config user.name "github-actions[bot]"
          git -C "${formula_repo_dir}" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "${formula_repo_dir}" add Formula/unifocl.rb
          git -C "${formula_repo_dir}" commit -m "unifocl ${version}"
          git -C "${formula_repo_dir}" push origin HEAD:main

      - name: Homebrew tap not configured
        if: vars.TAP_APP_CLIENT_ID == ''
        run: |
          echo "::warning::TAP_APP_CLIENT_ID is not set; skipping Homebrew formula update."
          echo "::warning::See .github/RELEASING.md for the GitHub App setup."

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish npm plugins
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          for plugin_dir in src/unifocl.claude-plugin src/unifocl.codex-plugin; do
            echo "Publishing npm package from ${plugin_dir}"
            pushd "${plugin_dir}" >/dev/null
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              pkg.version = process.env.VERSION;
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            "
            npm publish --access public --provenance
            popd >/dev/null
          done
